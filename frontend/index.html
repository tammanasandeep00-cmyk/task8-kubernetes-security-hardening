<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 8 Kubernetes Security</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 800px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    input {
      padding: 10px;
      width: 70%;
    }

    button {
      padding: 10px 18px;
      cursor: pointer;
    }

    li {
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }

    #status {
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>

<header>
  <h1>Task 8 Kubernetes Security Hardening</h1>
  <p>Frontend → Backend → MongoDB</p>
</header>

<div class="container">

  <div class="card">
    <h2>Backend Status</h2>
    <p id="status">Checking...</p>
  </div>

  <div class="card">
    <h2>Add Task</h2>
    <input id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>
  </div>

  <div class="card">
    <h2>Tasks</h2>
    <ul id="taskList"></ul>
  </div>

</div>

<script>
async function checkHealth() {
  try {
    const res = await fetch('/api/health');
    const data = await res.json();

    document.getElementById('status').innerText =
      `${data.status} | Database: ${data.database}`;
  } catch (error) {
    document.getElementById('status').innerText =
      'Backend unavailable';
  }
}

async function loadTasks() {
  try {
    const res = await fetch('/api/tasks');
    const tasks = await res.json();

    const list = document.getElementById('taskList');
    list.innerHTML = '';

    tasks.forEach(task => {
      const li = document.createElement('li');
      li.innerText = task.title;
      list.appendChild(li);
    });
  } catch (error) {
    console.error(error);
  }
}

async function addTask() {
  const input = document.getElementById('taskInput');

  if (!input.value.trim()) return;

  await fetch('/api/tasks', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      title: input.value
    })
  });

  input.value = '';
  loadTasks();
}

checkHealth();
loadTasks();
</script>

</body>
</html>
