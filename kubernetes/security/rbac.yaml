apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: task8-readonly-role
  namespace: task8
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-readonly-binding
  namespace: task8
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: task8
roleRef:
  kind: Role
  name: task8-readonly-role
  apiGroup: rbac.authorization.k8s.io
